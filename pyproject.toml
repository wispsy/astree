[project]
name = "astree"
version = "0.1.0"
description = "Shared structural traversal with specialized syntax-tree adapters"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
javascript = [
    "tree-sitter>=0.25",
    "tree-sitter-javascript>=0.25",
]

[project.urls]
Homepage = "https://github.com/wispsy/astree"
Repository = "https://github.com/wispsy/astree"
Issues = "https://github.com/wispsy/astree/issues"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**", "docs/**", "examples/**", "scripts/**", "LICENSE", "README.md"]
